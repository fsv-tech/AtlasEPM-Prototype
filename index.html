// =========================================================
function ProjectGantt({ p, disc, milestones }) {
  return <GanttView p={p} disc={disc} milestones={milestones}/>;
}
function GanttView({ p, disc, milestones }) {
  // Months from project start through end
  const start = new Date(p.start_date), end = new Date(p.end_date);
  const months = [];
  let cur = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), 1));
  while (cur <= end) {
    months.push({ y: cur.getUTCFullYear(), m: cur.getUTCMonth(), label: U.fmtDate(cur, "monthYr") });
    cur = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth()+1, 1));
  }
  const today = new Date("2026-05-19");
  const todayIdx = (today.getUTCFullYear() - start.getUTCFullYear()) * 12 + (today.getUTCMonth() - start.getUTCMonth());
  const colW = Math.max(58, Math.min(120, 900 / months.length));

  // Build bars per discipline (synthetic spans across project)
  function barsFor(d, i) {
    const total = months.length;
    const startIdx = Math.floor((i / disc.length) * total * 0.25);
    const endIdx = Math.min(total - 1, startIdx + Math.floor(total * (0.55 + (i%3) * 0.1)));
    return [{ start: startIdx, end: endIdx, label: d.name + " — phase 1" }];
  }

  return (
    <div className="card flush" style={{ overflow: "auto" }}>
      <div className="table-head">
        <div className="table-head-l">
          <h3 className="card-title">Schedule — Gantt</h3>
          <div className="muted tiny">Monthly view · {months.length} months · drag bars to reschedule</div>
        </div>
        <div className="row" style={{ gap: 8 }}>
          <div className="chips">
            <button className="chip active">Months</button>
            <button className="chip">Weeks</button>
            <button className="chip">Days</button>
          </div>
          <button className="btn sm"><Ico name="filter" size={12}/>Filter</button>
        </div>
      </div>

      <div style={{ overflowX: "auto" }}>
        {/* Header */}
        <div style={{ display: "grid", gridTemplateColumns: `220px repeat(${months.length}, ${colW}px)`, background: "var(--surface-2)", borderBottom: "1px solid var(--line)", position: "sticky", top: 0, zIndex: 1 }}>
          <div style={{ padding: "10px 14px", fontSize: 11, color: "var(--ink-4)", letterSpacing: "0.1em", textTransform: "uppercase", borderRight: "1px solid var(--line)" }}>Workstream</div>
          {months.map((m, i) => (
            <div key={i} style={{ padding: "10px 6px", fontSize: 10.5, color: i === todayIdx ? "var(--accent)" : "var(--ink-4)", letterSpacing: "0.06em", textTransform: "uppercase", textAlign: "center", borderRight: "1px solid var(--line)", fontWeight: i === todayIdx ? 600 : 400 }}>
              {m.label}
            </div>
          ))}
        </div>

        {disc.map((d, i) => {
          const bars = barsFor(d, i);
          return (
            <div key={d.discipline_id} style={{ display: "grid", gridTemplateColumns: `220px repeat(${months.length}, ${colW}px)`, position: "relative", borderBottom: "1px solid var(--line)" }}>
              <div style={{ padding: "12px 14px", background: "var(--surface-2)", borderRight: "1px solid var(--line)" }}>
                <div className="row" style={{ gap: 8 }}>
                  <span style={{ width: 8, height: 8, borderRadius: 2, background: U.disciplineColors[d.name] }}/>
                  <span style={{ fontSize: 12.5 }}>{d.name}</span>
                </div>
                <div className="muted tiny mono" style={{ marginTop: 2 }}>{d.completion_percent}% · {(d.actual_hours/1000).toFixed(1)}K h</div>
              </div>
              {months.map((_, j) => (
                <div key={j} style={{ borderRight: "1px solid var(--line)", height: 52, background: j === todayIdx ? "rgba(37, 99, 235, 0.04)" : null }}/>
              ))}
              {bars.map((b, k) => (
                <div key={k} className="gantt-bar" style={{
                  left: 220 + b.start*colW + 4,
                  width: (b.end - b.start + 1)*colW - 8,
                  background: U.disciplineColors[d.name],
                  height: 24, top: 14,
                }}>
                  <span style={{ opacity: 0.9 }}>{b.label}</span>
                </div>
              ))}
            </div>
          );
        })}

        {/* Milestones row */}
        <div style={{ display: "grid", gridTemplateColumns: `220px repeat(${months.length}, ${colW}px)`, position: "relative", background: "var(--bg)" }}>
          <div style={{ padding: "12px 14px", background: "var(--surface-2)", borderRight: "1px solid var(--line)", fontSize: 12.5, fontWeight: 500 }}>
            <div className="row" style={{ gap: 8 }}><Ico name="diamond" size={12} color="var(--accent)"/>Milestones</div>
          </div>
          {months.map((_, j) => (
            <div key={j} style={{ borderRight: "1px solid var(--line)", height: 44, background: j === todayIdx ? "rgba(37, 99, 235, 0.04)" : null }}/>
          ))}
          {milestones.map(m => {
            const d = new Date(m.due_date);
            const monthIdx = (d.getUTCFullYear() - start.getUTCFullYear()) * 12 + (d.getUTCMonth() - start.getUTCMonth());
            const dayFrac = d.getUTCDate() / 30;
            const x = 220 + (monthIdx + dayFrac) * colW;
            return (
              <div key={m.milestone_id} style={{ position: "absolute", left: x - 8, top: 12, textAlign: "center" }} title={m.title}>
                <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1L15 8L8 15L1 8z" fill={m.status === "Completed" ? "var(--green)" : m.status === "Active" ? "var(--accent)" : "var(--ink-4)"}/></svg>
                <div className="mono" style={{ fontSize: 9, color: "var(--ink-3)", marginTop: 2, whiteSpace: "nowrap" }}>{m.milestone_id}</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

        const total = allocs.filter(a => a.week_index === w.index).reduce((s,a)=> s + (a.planned_hours || 0), 0);
        const pct = Math.min(120, (total/40)*100);
        const color = pct > 100 ? "var(--red)" : pct > 80 ? "var(--amber)" : "var(--accent)";
        return (
          <div key={w.index} style={{ background: "var(--surface-2)", borderRadius: 8, padding: 10, border: w.isCurrent ? "1px solid var(--accent)" : "1px solid var(--line)", textAlign:"center" }}>

        );

function ScreenCalendar() {
  const [granularity, setGranularity] = React.useState("Week");
  const [filterDisc, setFilterDisc]   = React.useState("All");
  const weeks = DB.planningWeeks;

  // Build per-employee weekly totals
  const emps = DB.employees.filter(e => filterDisc === "All" || e.discipline === filterDisc);
  function totalForEmp(empId, weekIdx) {
    return DB.allocations
      .filter(a => a.employee_id === empId && a.week_index === weekIdx)
      .reduce((s,a) => s + (a.planned_hours || 0), 0);
  }
  function projectsForEmp(empId, weekIdx) {
    return DB.allocations
      .filter(a => a.employee_id === empId && a.week_index === weekIdx && a.planned_hours > 0)
      .map(a => DB.projectById(a.project_id));
  }

  // Filter to people who actually have allocations (otherwise the grid is full of empty rows)
  const empsWithAlloc = emps.filter(e => weeks.some(w => totalForEmp(e.employee_id, w.index) > 0));

  const disciplines = ["All", ...Array.from(new Set(DB.employees.map(e => e.discipline)))];
  const colWidth = 80;

  return (
    <div className="content">
      <PageHeader
        eyebrow="Plan"
        title="Resource planning"
        subtitle="14-week rolling capacity view. Drag a bar to reallocate, or click a cell to edit hours."

            <div className="chips">
              {["Day","Week","Month"].map(g => (
                <button key={g} className={"chip" + (granularity === g ? " active" : "")} onClick={() => setGranularity(g)}>{g}</button>

            </div>
            <button className="btn"><Ico name="filter" size={13}/>Filters</button>

          </>
        }

      <div className="kpi-grid">
        <KPI label="Engineers loaded" icon="users" value={empsWithAlloc.length}/>
        <KPI label="Total planned hrs (wk 20)" icon="clock" value={empsWithAlloc.reduce((s,e)=>s+totalForEmp(e.employee_id, 5), 0).toLocaleString()}/>
        <KPI label="Avg utilization" icon="activity" value="84%" delta="+3 vs target" deltaDir="up"/>
        <KPI label="Over-allocated" icon="alertTri" value={empsWithAlloc.filter(e => totalForEmp(e.employee_id,5) > 40).length} delta="needs reshuffling" deltaDir="down"/>
        <KPI label="Holiday conflicts" icon="alertCirc" value={2} foot="next 4 weeks"/>
      </div>

      {/* Legend + filters */}
      <FilterBar
        chips={disciplines.map(d => ({ value: d, label: d, count: d === "All" ? DB.employees.length : DB.employees.filter(e=>e.discipline===d).length }))}

        right={
          <div className="row" style={{ gap: 12, fontSize: 11, color: "var(--ink-3)" }}>
            <span className="row" style={{gap: 5}}><span style={{width:10, height:10, borderRadius:2, background:"var(--accent)"}}/>Allocated</span>
            <span className="row" style={{gap: 5}}><span style={{width:10, height:10, borderRadius:2, background:"var(--amber)"}}/>Near capacity</span>
            <span className="row" style={{gap: 5}}><span style={{width:10, height:10, borderRadius:2, background:"var(--red)"}}/>Over-allocated</span>
            <span className="row" style={{gap: 5}}><span style={{width:10, height:10, borderRadius:2, background:"var(--ink-5)"}}/>Available</span>

        {empsWithAlloc.map(e => (
          <div key={e.employee_id} style={{ display: "grid", gridTemplateColumns: `240px repeat(${weeks.length}, ${colWidth}px)`, borderBottom: "1px solid var(--line)" }}>

            </div>
            {weeks.map(w => {

              const pct = (total / 40) * 100;
              const color = pct > 100 ? "var(--red)" : pct > 80 ? "var(--amber)" : pct > 0 ? "var(--accent)" : "transparent";
              const projs = projectsForEmp(e.employee_id, w.index);

                    <div style={{ display: "flex", gap: 1, marginTop: 3 }}>
                      {projs.slice(0,3).map((p, i) => (
                        <div key={i} style={{ flex: 1, height: 4, background: U.disciplineColors[p.project_type] || "var(--ink-4)", borderRadius: 1 }} title={p.project_code}/>
                      ))}
                    </div>

      <div className="card" style={{ borderLeft: "3px solid var(--red)" }}>

          <Ico name="alertTri" size={16} color="var(--red)"/>
          <span style={{ fontWeight: 500 }}>Over-allocation detected</span>
        </div>
        <div className="muted" style={{ fontSize: 13 }}>
          2 engineers exceed 100% allocation in W21–W22. Suggestion: shift Yusuf Korkmaz (Mech, 120%) partially to EXP-204, or bring forward Carlos Mendes (Struct, 88% capacity headroom).

          <button className="btn sm">Auto-balance</button>
          <button className="btn sm">Open scenarios</button>
        </div>
      </div>
    </div>
  );
}

function ScreenCost() {
  // Portfolio cost view + drill-down
  const totalBudget = DB.projects.reduce((s,p)=>s+p.budget, 0);
  const totalSpent  = DB.costs.reduce((s,c)=>s+c.spent, 0);
  const totalForecast = DB.costs.reduce((s,c)=>s+c.forecast, 0);
  const totalCommitted = DB.costs.reduce((s,c)=>s+c.committed, 0);

  // Monthly burn (synthetic across all projects)
  const months = ["Aug 25","Sep","Oct","Nov","Dec","Jan 26","Feb","Mar","Apr","May"];
  const burnByMonth = [1.2,1.4,1.6,1.8,2.1,2.4,2.6,2.8,3.0,3.2];
  const cumulative  = burnByMonth.reduce((acc, v) => { acc.push((acc[acc.length-1]||0) + v); return acc; }, []);

  return (
    <div className="content">
      <PageHeader
        eyebrow="Commercial"
        title="Cost management"
        subtitle="Portfolio-level cost dashboard — drill into a project for the full engine."
        actions={
          <>
            <button className="btn"><Ico name="upload" size={13}/>Import POs</button>
            <button className="btn"><Ico name="download" size={13}/>Cost report</button>
            <button className="btn primary"><Ico name="plus" size={13}/>New cost line</button>
          </>
        }
      />

      <div className="kpi-grid">
        <KPI featured label="Total budget" icon="dollar" value={"$" + (totalBudget/1e6).toFixed(1)} unit="M"/>
        <KPI label="Committed" icon="briefcase" value={"$" + (totalCommitted/1e6).toFixed(1)} unit="M" foot={Math.round(totalCommitted/totalBudget*100) + "% of budget"}/>
        <KPI label="Spent to date" icon="coin" value={"$" + (totalSpent/1e6).toFixed(1)} unit="M" foot={Math.round(totalSpent/totalBudget*100)+"%"} sparkData={cumulative}/>
        <KPI label="Forecast at completion" icon="trendUp" value={"$" + (totalForecast/1e6).toFixed(1)} unit="M" delta={"$" + ((totalForecast-totalBudget)/1e6).toFixed(2) + "M variance"} deltaDir={totalForecast > totalBudget ? "down" : "up"}/>
        <KPI label="Margin" icon="target" value="14.2%" delta="Target 12%" deltaDir="up"/>
      </div>

      <div className="grid" style={{ gridTemplateColumns: "1.4fr 1fr" }}>
        <div className="card">
          <CardH title="Monthly burn rate" subtitle="Across all active projects · USD M"/>
          <Bars w={500} h={140} barW={32} gap={10} values={burnByMonth} labels={months}
                colors={burnByMonth.map((_,i)=> i === burnByMonth.length-1 ? "var(--accent)" : "var(--ink-5)")}/>
          <div className="row" style={{ justifyContent: "space-between", marginTop: 8, fontSize: 11, color: "var(--ink-3)" }}>
            <span>Last 10 months</span>
            <span>Total: <span className="mono">${cumulative[cumulative.length-1].toFixed(1)}M</span></span>
          </div>
        </div>

        <div className="card">
          <CardH title="Forecast variance" subtitle="By project"/>
          <div className="col" style={{ gap: 8 }}>
            {DB.projects.map(p => {
              const c = DB.costs.find(c => c.project_id === p.project_id);
              const vPct = c.variance / p.budget * 100;
              const color = vPct > 2 ? "var(--red)" : vPct > 0 ? "var(--amber)" : "var(--green)";
              return (
                <div key={p.project_id} className="row" style={{ gap: 10 }}>
                  <span className="mono tiny muted" style={{ width: 60 }}>{p.project_code}</span>
                  <span style={{ fontSize: 12.5, flex: 1, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{p.project_name}</span>
                  <span className="mono tiny" style={{ color, width: 70, textAlign:"right" }}>{c.variance > 0 ? "+" : ""}${(c.variance/1000).toFixed(0)}K</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      <div className="card flush">
        <div className="table-head">
          <div className="table-head-l">
            <h3 className="card-title">Project cost summary</h3>
            <div className="muted tiny">Click a row to open the project's cost engine</div>
          </div>
          <button className="btn sm"><Ico name="filter" size={12}/>Filter</button>
        </div>
        <table className="data">
          <thead>
            <tr>
              <th>Project</th><th>Client</th>
              <th className="num">Budget</th><th className="num">Committed</th><th className="num">Spent</th><th className="num">Forecast</th><th className="num">Variance</th><th>Health</th>
            </tr>
          </thead>
          <tbody>
            {DB.projects.map(p => {
              const c = DB.costs.find(c => c.project_id === p.project_id);
              return (
                <tr key={p.project_id} onClick={() => navTo("projects/" + p.project_id + "/cost")}>
                  <td>
                    <div className="cell-strong">{p.project_name}</div>
                    <div className="cell-sub mono">{p.project_code}</div>
                  </td>
                  <td>{p.client}</td>
                  <td className="num cell-num">${(c.budget/1e6).toFixed(2)}M</td>
                  <td className="num cell-num">${(c.committed/1e6).toFixed(2)}M</td>
                  <td className="num cell-num">${(c.spent/1e6).toFixed(2)}M</td>
                  <td className="num cell-num">${(c.forecast/1e6).toFixed(2)}M</td>
                  <td className="num cell-num" style={{ color: c.variance > 0 ? "var(--red)" : "var(--green)" }}>{c.variance > 0 ? "+" : ""}${(c.variance/1000).toFixed(0)}K</td>
                  <td>
                    <span style={{ display:"inline-block", width: 10, height: 10, borderRadius:"50%", background: p.health === "green" ? "var(--green)" : p.health === "amber" ? "var(--amber)" : "var(--red)" }}/>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function ScreenNotifications() {
  const [tab, setTab] = React.useState("All");
  const list = DB.notifications.filter(n => tab === "All" ? true : tab === "Unread" ? !n.read : n.type === tab.toLowerCase());

  // Group by day
  function ymd(s) { return s.slice(0,10); }
  const grouped = {};
  list.forEach(n => {
    const day = ymd(n.created_at);
    grouped[day] = grouped[day] || [];
    grouped[day].push(n);
  });
  const days = Object.keys(grouped).sort().reverse();

  const today = "2026-05-19";
  const dayLabel = (d) => d === today ? "Today" : d === "2026-05-18" ? "Yesterday" : U.fmtDate(d, "medium");

  return (
    <div className="content" style={{ maxWidth: 900 }}>
      <PageHeader
        eyebrow="Insights"
        title="Notifications"
        subtitle="Approvals, deliverable updates, budget alerts, mentions."
        actions={<button className="btn"><Ico name="check" size={13}/>Mark all read</button>}
      />

      <Tabs active={tab} onChange={setTab} tabs={[
        { value: "All", label: "All", count: DB.notifications.length },
        { value: "Unread", label: "Unread", count: DB.notifications.filter(n => !n.read).length },
        { value: "Approval", label: "Approvals", count: DB.notifications.filter(n => n.type === "approval").length },
        { value: "Deliverable", label: "Deliverables", count: DB.notifications.filter(n => n.type === "deliverable").length },
        { value: "Budget", label: "Budget" },
        { value: "Risk", label: "Risks" },
        { value: "Mention", label: "Mentions" },
      ]}/>

      <div className="card flush">
        {days.map(day => (
          <div key={day}>
            <div style={{ padding: "12px 18px", background: "var(--surface-2)", borderBottom: "1px solid var(--line)", fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: "var(--ink-4)", fontWeight: 500 }}>
              {dayLabel(day)} <span className="mono" style={{ float: "right" }}>{grouped[day].length}</span>
            </div>
            {grouped[day].map(n => (
              <div key={n.id} style={{ padding: "14px 18px", borderBottom: "1px solid var(--line)", display: "flex", gap: 12, background: !n.read ? "var(--accent-soft-2)" : "transparent", cursor: "pointer" }}>
                <div style={{
                  width: 32, height: 32, borderRadius: 10,
                  background: n.type === "approval" ? "var(--blue-soft)" :
                              n.type === "deliverable" ? "var(--violet-soft)" :
                              n.type === "budget" ? "var(--amber-soft)" :
                              n.type === "risk" ? "var(--red-soft)" :
                              "var(--surface-3)",
                  color:      n.type === "approval" ? "var(--blue)" :
                              n.type === "deliverable" ? "var(--violet)" :
                              n.type === "budget" ? "var(--amber)" :
                              n.type === "risk" ? "var(--red)" :
                              "var(--ink-3)",
                  display: "grid", placeItems: "center", flexShrink: 0,
                }}>
                  <Ico name={
                    n.type === "approval" ? "checkSquare" :
                    n.type === "deliverable" ? "layers" :
                    n.type === "budget" ? "dollar" :
                    n.type === "risk" ? "shield" :
                    n.type === "change" ? "git" :
                    n.type === "mention" ? "at" :
                    "bell"
                  } size={15}/>
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="row" style={{ gap: 8 }}>
                    <span style={{ fontSize: 13.5, fontWeight: 500 }}>{n.title}</span>
                    <span className="badge outline" style={{ fontSize: 9.5 }}>{n.type}</span>
                  </div>
                  <div style={{ fontSize: 12.5, color: "var(--ink-3)", marginTop: 3 }}>{n.message}</div>
                </div>
                <div style={{ textAlign: "right" }}>
                  <div className="muted tiny mono">{n.created_at.slice(11,16)}</div>
                  {!n.read && <span style={{ display: "inline-block", width: 8, height: 8, background: "var(--accent)", borderRadius: "50%", marginTop: 6 }}/>}

function PermissionMatrix() {
  const modules = ["Dashboard","Projects","Resources","Disciplines","Deliverables","Costs","Approvals","Reports","Risks","Changes","Documents","Analytics","Admin","Settings"];
  const roles   = ["Admin","Exec","PM","Lead","Engineer","Planner","Comm.","Client","DocCtrl","QA"];
  // Permission levels: full (✓), view (V), limited (L), approval (A), none (—)
  const matrix = {
    "Dashboard":   ["✓","✓","✓","✓","V","✓","✓","V","V","V"],
    "Projects":    ["✓","V","✓","L","V","L","L","V","—","V"],
    "Resources":   ["✓","V","✓","L","V","✓","—","—","—","—"],
    "Disciplines": ["✓","V","✓","✓","L","V","—","—","—","V"],
    "Deliverables":["✓","V","✓","✓","L","—","—","V","✓","✓"],
    "Costs":       ["✓","✓","✓","V","—","V","✓","—","—","—"],
    "Approvals":   ["✓","V","A","A","—","—","A","—","—","A"],
    "Reports":     ["✓","✓","✓","V","V","✓","✓","V","—","V"],
    "Risks":       ["✓","✓","✓","✓","L","—","—","—","—","✓"],
    "Changes":     ["✓","V","✓","A","L","—","A","—","—","✓"],
    "Documents":   ["✓","V","✓","✓","L","—","—","V","✓","✓"],
    "Analytics":   ["✓","✓","✓","V","—","✓","✓","—","—","—"],
    "Admin":       ["✓","—","—","—","—","—","—","—","—","—"],
    "Settings":    ["✓","—","—","—","—","—","—","—","—","—"],
  };
  function symbolToBadge(s) {
    if (s === "✓") return <span className="badge success" style={{ fontSize: 10 }}>Full</span>;
    if (s === "V") return <span className="badge info" style={{ fontSize: 10 }}>View</span>;
    if (s === "L") return <span className="badge warn" style={{ fontSize: 10 }}>Limited</span>;
    if (s === "A") return <span className="badge violet" style={{ fontSize: 10 }}>Approve</span>;
    return <span className="muted xs">—</span>;
  }
  return (
    <table className="data">
      <thead>
        <tr>
          <th style={{ position: "sticky", left: 0, background: "var(--surface-2)", zIndex: 1 }}>Module</th>
          {roles.map(r => <th key={r}>{r}</th>)}
        </tr>
      </thead>
      <tbody>
        {modules.map(m => (
          <tr key={m}>
            <td style={{ position: "sticky", left: 0, background: "var(--surface)", fontWeight: 500 }}>{m}</td>
            {matrix[m].map((p, i) => <td key={i}>{symbolToBadge(p)}</td>)}
          </tr>
        ))}
      </tbody>
    </table>
  );
}

Object.assign(window, { ScreenReports, ScreenAnalytics, ScreenNotifications, ScreenSettings, PermissionMatrix });

  </script>

  <script type="text/babel">
// ============================================
// Atlas — App root + route dispatch
// ============================================

function App() {
  const r = useRoute();
  const [role, setRole] = React.useState(() => {
    const params = new URLSearchParams(location.search);
    return params.get("role") || "Project Manager";
  });

  // login screen has no shell
  if (r.route === "login") {
    return <ScreenLogin/>;
  }

  // resolve which screen
  let screen;
  switch (r.route) {
    case "dashboard":  screen = <ScreenDashboard role={role}/>; break;
    case "projects":
      if (!r.parts[0])                screen = <ScreenProjectsList/>;
      else if (r.parts[0] === "new")  screen = <ScreenProjectCreate/>;
      else                            screen = <ScreenProjectDetail projectId={r.parts[0]} tab={r.parts[1] || "overview"}/>;
      break;
    case "employees":
      if (!r.parts[0])                screen = <ScreenEmployees/>;
      else                            screen = <ScreenEmployeeDetail employeeId={r.parts[0]}/>;
      break;
    case "calendar":      screen = <ScreenCalendar/>; break;
    case "gantt":         screen = <ScreenGantt/>; break;
    case "cost":          screen = <ScreenCost/>; break;
    case "deliverables":
      if (!r.parts[0])                screen = <ScreenDeliverables/>;
      else                            screen = <ScreenDeliverableDetail deliverableId={r.parts[0]}/>;
      break;
    case "approvals":     screen = <ScreenApprovals/>; break;
    case "changes":       screen = <ScreenChanges/>; break;
    case "risks":         screen = <ScreenRisks/>; break;
    case "reports":       screen = <ScreenReports/>; break;
    case "analytics":     screen = <ScreenAnalytics/>; break;
    case "notifications": screen = <ScreenNotifications/>; break;
    case "settings":      screen = <ScreenSettings/>; break;
    default:              screen = <ScreenDashboard role={role}/>;
  }

  return (
    <div className="app">
      <Sidebar route={r.raw || r.route} role={role}/>
      <div className="main">
        <Topbar route={r.route} role={role}/>
        {screen}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);

  </script>
</body>
</html>
