<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1440"/>
  <title>Atlas — Engineering PM</title>

  <style>
/* ==================================================================
   Atlas — Engineering PM Platform
   Design tokens + base styles — Ramboll Brand Palette
   ================================================================== */

/* =================================================================
   RAMBOLL BRAND PALETTE
   Primary:   Ramboll Cyan   #00ADB2  RGB(0,173,178)
   Anchor:    Corporate Dark  #19162C  RGB(25,22,44)
   Canvas:    White           #FFFFFF
   Secondary: Environmental greens, ocean blues, neutral grays
   ================================================================= */

:root {
  /* ---- Surfaces & ink (white canvas + Ramboll neutral grays) ---- */
  --bg:           #F5F6F7;
  --bg-2:         #EBEBED;
  --surface:      #FFFFFF;
  --surface-2:    #F8F9FA;
  --surface-3:    #EEEEF0;
  --surface-hover:#F0F4F5;

  /* Ramboll Corporate Dark Charcoal → text hierarchy */
  --ink:   #19162C;          /* Corporate Dark — primary text */
  --ink-2: #2E2B3D;          /* Dark charcoal — headings */
  --ink-3: #5C5870;          /* Mid charcoal — secondary text */
  --ink-4: #8C89A0;          /* Muted charcoal — labels */
  --ink-5: #B8B6C6;          /* Light charcoal — placeholders */
  --ink-6: #DDDCE4;          /* Near-white charcoal — borders */

  --line:       #E2E1E8;
  --line-2:     #CCCBD6;
  --line-strong:#8C89A0;

  /* ---- Primary Brand ---- */
  /* Ramboll Cyan — focal color, logos, key branding accents */
  --navy:        #19162C;          /* Corporate Dark — sidebar, anchors */
  --navy-2:      #2B2740;          /* Lighter dark — hover states */
  --navy-soft:   #E8E7EE;

  --accent:       #00ADB2;         /* Ramboll Cyan — primary interactive */
  --accent-hover: #008F94;         /* Cyan darkened 15% for hover */
  --accent-2:     #00C4CA;         /* Cyan lightened — secondary use */
  --accent-soft:  #D0F2F3;         /* Cyan 15% tint */
  --accent-soft-2:#E8F9FA;         /* Cyan 8% tint — backgrounds */

  /* ---- Status / chart palette — Ramboll functional & environmental ---- */
  /* Primary Ramboll Cyan family */
  --blue:   #00ADB2;   --blue-soft:   #D0F2F3;   /* Ramboll Cyan — primary data */
  --cyan:   #00C4CA;   --cyan-soft:   #DFFBFC;   /* Cyan light — secondary data */
  --teal:   #168494;   --teal-soft:   #CBE9EE;   /* Ocean blue — data tier 3 */

  /* Environmental tones — biodiversity, sustainability, decarbonization */
  --green:  #3D8C6F;   --green-soft:  #D4EDE5;   /* Earth green — positive/on-track */
  --lime:   #6BAA72;   --lime-soft:   #DEF0E0;   /* Soft sage green — environmental */

  /* Functional / alert palette */
  --amber:  #D97706;   --amber-soft:  #FEF3C7;   /* Amber — warning / at-risk */
  --orange: #C2550F;   --orange-soft: #FDE8D8;   /* Deep orange — caution */
  --red:    #C0392B;   --red-soft:    #FADADD;   /* Corporate red — critical */

  /* Neutral functional */
  --pink:   #9B6B8A;   --pink-soft:   #EDE0E9;
  --violet: #6B5FA8;   --violet-soft: #E4E1F4;   /* Corporate purple — planning */
  --indigo: #4B5BA8;   --indigo-soft: #DDE0F5;
  --slate:  #5C5870;   --slate-soft:  #E5E4EB;   /* Charcoal slate — neutral/closed */

  /* ---- Typography ---- */
  /* Primary:  Arial (Regular + Black for corporate weight contrast)  */
  /* Alternate: Helvetica Neue / Helvetica / system sans-serif stack  */
  --font-sans:  Arial, "Helvetica Neue", Helvetica, "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
  --font-black: "Arial Black", "Arial Bold", Arial, "Helvetica Neue", sans-serif;
  --font-mono:  "Courier New", Courier, "Lucida Console", monospace;

  /* ---- Radii ---- */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 16px;
  --r-2xl: 20px;
  --r-full: 999px;

  /* ---- Shadow (keyed to corporate dark #19162C) ---- */
  --shadow-xs: 0 1px 1px rgba(25, 22, 44, 0.04);
  --shadow-sm: 0 1px 2px rgba(25, 22, 44, 0.06), 0 1px 1px rgba(25, 22, 44, 0.04);
  --shadow-md: 0 4px 12px rgba(25, 22, 44, 0.07), 0 1px 2px rgba(25, 22, 44, 0.04);
  --shadow-lg: 0 12px 32px rgba(25, 22, 44, 0.10), 0 2px 4px rgba(25, 22, 44, 0.04);
  --shadow-xl: 0 24px 48px rgba(25, 22, 44, 0.16), 0 4px 8px rgba(25, 22, 44, 0.06);

  /* ---- Sizing ---- */
  --sidebar-w: 232px;
  --topbar-h: 56px;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
}
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* =============== App shell =============== */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
  background: var(--bg);
}
.app.fullscreen { grid-template-columns: 1fr; }
.app.collapsed { --sidebar-w: 60px; }

/* =============== Sidebar =============== */
.sidebar {
  background: var(--navy);
  color: #C8CDD7;
  padding: 14px 10px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 8px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 12px;
  color: #fff;
}
.brand-mark {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 7px;
  display: grid; place-items: center;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.04em;
  color: #fff;
  flex-shrink: 0;
}
.brand-name {
  font-family: var(--font-black);
  font-size: 13px; font-weight: 900; letter-spacing: -0.01em;
  white-space: nowrap;
}
.brand-sub {
  font-size: 9.5px; letter-spacing: 0.10em; text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  margin-top: -1px;
}

.nav-section {
  font-size: 9.5px; letter-spacing: 0.10em; text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  padding: 12px 10px 6px;
  font-weight: 500;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 400;
  color: #C8CDD7;
  cursor: pointer;
  transition: background 120ms, color 120ms;
  position: relative;
}
.nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.nav-item.active { background: rgba(255,255,255,0.10); color: #fff; }
.nav-item.active::before {
  content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px;
  width: 2px; background: var(--accent); border-radius: 1px;
}
.nav-icon { color: rgba(255,255,255,0.6); width: 16px; height: 16px; flex-shrink: 0; }
.nav-item:hover .nav-icon, .nav-item.active .nav-icon { color: #fff; }
.nav-label { flex: 1; }
.nav-badge {
  font-size: 10px;
  background: rgba(255,255,255,0.10);
  color: #fff;
  padding: 1px 6px;
  border-radius: 999px;
  font-feature-settings: "tnum";
  min-width: 22px;
  text-align: center;
}
.nav-badge.accent { background: var(--accent); }
.nav-badge.danger { background: var(--red); }
.collapsed .nav-label, .collapsed .nav-section, .collapsed .nav-badge, .collapsed .brand-name, .collapsed .brand-sub { display: none; }
.collapsed .nav-item { justify-content: center; padding: 8px 4px; }

.sidebar-footer { margin-top: auto; padding: 8px 8px 4px; }
.role-switcher {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.role-switcher .label {
  font-size: 9.5px; letter-spacing: 0.10em; text-transform: uppercase;
  color: rgba(255,255,255,0.45);
}
.role-switcher select {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px;
  color: #fff;
  padding: 6px 8px;
  font-size: 12px;
  width: 100%;
  outline: none;
}
.role-switcher select:focus { border-color: var(--accent); }

/* =============== Top bar =============== */
.main {
  display: flex; flex-direction: column;
  min-width: 0;
}
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 24px;
  height: var(--topbar-h);
}
.topbar-search {
  flex: 1;
  max-width: 420px;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px;
  background: var(--surface-3);
  border-radius: 8px;
  color: var(--ink-3);
  font-size: 13px;
}
.topbar-search input { border: none; background: none; outline: none; flex: 1; font-size: 13px; }
.topbar-search kbd {
  font-family: var(--font-mono); font-size: 10.5px;
  padding: 2px 6px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
  color: var(--ink-4);
}
.topbar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.icon-btn {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 8px;
  color: var(--ink-3);
  position: relative;
}
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn .dot {
  position: absolute; top: 7px; right: 8px;
  width: 7px; height: 7px;
  background: var(--red);
  border-radius: 50%;
  border: 2px solid var(--surface);
}
.user-chip {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 10px 4px 4px;
  background: var(--surface-3);
  border-radius: 8px;
  cursor: pointer;
}
.user-chip:hover { background: var(--surface-hover); }
.user-chip .avatar { width: 26px; height: 26px; }
.user-chip .name { font-size: 12.5px; font-weight: 500; line-height: 1.15; }
.user-chip .role { font-size: 10.5px; color: var(--ink-4); }

/* =============== Content =============== */
.content {
  padding: 20px 24px 40px;
  display: flex; flex-direction: column;
  gap: 16px;
  max-width: 1600px;
  width: 100%;
}
.page-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 4px;
}
.page-eyebrow {
  font-size: 10.5px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--ink-4);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-weight: 500;
}
.page-title {
  font-family: var(--font-black);
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.025em;
  margin: 0;
  line-height: 1.15;
}
.page-subtitle {
  color: var(--ink-3);
  margin-top: 4px;
  font-size: 13px;
}
.crumb {
  display: flex; gap: 6px; align-items: center;
  font-size: 12px; color: var(--ink-4);
  margin-bottom: 8px;
}
.crumb a { color: var(--ink-4); }
.crumb a:hover { color: var(--ink); }
.crumb svg { opacity: 0.5; }

/* =============== Cards =============== */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
}
.card.flush { padding: 0; }
.card.featured { background: var(--navy); color: #fff; border-color: transparent; }
.card.muted { background: var(--surface-2); }
.card-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.card-title {
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
}
.card-action {
  font-size: 12px;
  color: var(--ink-3);
  display: inline-flex; align-items: center; gap: 4px;
}
.card-action:hover { color: var(--accent); }
.card.featured .card-title { color: #fff; }
.card.featured .card-action { color: rgba(255,255,255,0.7); }

/* =============== KPI =============== */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}
.kpi.featured {
  background: var(--navy);
  color: #fff;
  border-color: transparent;
}
.kpi.featured .kpi-label, .kpi.featured .kpi-delta { color: rgba(255,255,255,0.65); }
.kpi-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-4);
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 6px;
}
.kpi-value {
  font-family: var(--font-black);
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.03em;
  line-height: 1.1;
  font-feature-settings: "tnum";
}
.kpi-value .unit {
  font-size: 13px;
  font-weight: 400;
  color: var(--ink-3);
  margin-left: 3px;
  letter-spacing: 0;
}
.kpi-foot {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 8px;
  gap: 8px;
}
.kpi-delta {
  font-size: 11.5px;
  color: var(--ink-4);
  display: inline-flex; align-items: center; gap: 4px;
  font-feature-settings: "tnum";
}
.kpi-delta.up { color: var(--green); }
.kpi-delta.down { color: var(--red); }

/* =============== Buttons =============== */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 13px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink);
  white-space: nowrap;
  transition: background 120ms, border-color 120ms, transform 40ms;
}
.btn:hover { background: var(--surface-3); border-color: var(--line-2); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.navy {
  background: var(--navy); color: #fff; border-color: var(--navy);
}
.btn.navy:hover { background: var(--navy-2); }
.btn.ghost {
  background: transparent;
  border-color: transparent;
  color: var(--ink-3);
}
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn.danger {
  background: var(--red); color: #fff; border-color: var(--red);
}
.btn.danger:hover { background: #DC2626; }
.btn.success {
  background: var(--green); color: #fff; border-color: var(--green);
}
.btn.success:hover { background: #059669; }
.btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
.btn.xs { padding: 3px 8px; font-size: 11px; border-radius: 5px; gap: 4px; }
.btn.icon-only { padding: 7px; }

/* =============== Badges =============== */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 500;
  background: var(--surface-3);
  color: var(--ink-2);
  white-space: nowrap;
  line-height: 1.45;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.7; }
.badge.outline { background: transparent; border: 1px solid var(--line-2); color: var(--ink-3); }
.badge.neutral { background: var(--surface-3); color: var(--ink-2); }
.badge.blue   { background: var(--blue-soft);   color: #1E40AF; }
.badge.cyan   { background: var(--cyan-soft);   color: #0E7490; }
.badge.green  { background: var(--green-soft);  color: #047857; }
.badge.amber  { background: var(--amber-soft);  color: #92400E; }
.badge.orange { background: var(--orange-soft); color: #9A3412; }
.badge.red    { background: var(--red-soft);    color: #B91C1C; }
.badge.violet { background: var(--violet-soft); color: #5B21B6; }
.badge.slate  { background: var(--slate-soft);  color: #334155; }
.badge.success { background: var(--green-soft); color: #047857; }
.badge.warn    { background: var(--amber-soft); color: #92400E; }
.badge.danger  { background: var(--red-soft);   color: #B91C1C; }
.badge.info    { background: var(--blue-soft);  color: #1E40AF; }

/* =============== Avatars =============== */
.avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--slate-soft);
  color: var(--slate);
  display: inline-grid; place-items: center;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
  letter-spacing: 0;
}
.avatar.with-ring { border: 2px solid var(--surface); }
.avatar.sm { width: 22px; height: 22px; font-size: 9.5px; }
.avatar.md { width: 32px; height: 32px; font-size: 12px; }
.avatar.lg { width: 44px; height: 44px; font-size: 14px; }
.avatar.xl { width: 64px; height: 64px; font-size: 18px; }
.avatar-stack { display: inline-flex; }
.avatar-stack .avatar + .avatar { margin-left: -8px; }

/* =============== Tables =============== */
.table-wrap {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.table-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px;
  gap: 12px;
  border-bottom: 1px solid var(--line);
}
.table-head-l { display: flex; flex-direction: column; gap: 2px; }
.table-head-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.data thead th {
  text-align: left;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--ink-4);
  padding: 10px 16px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  white-space: nowrap;
}
table.data thead th.num, table.data tbody td.num { text-align: right; font-family: var(--font-mono); }
table.data tbody td {
  padding: 11px 16px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
table.data tbody tr:last-child td { border-bottom: none; }
table.data tbody tr:hover { background: var(--surface-2); cursor: pointer; }
table.data tbody tr.selected { background: var(--accent-soft-2); }
table.data tbody tr.selected td { border-color: var(--accent-soft); }
.cell-id { font-family: var(--font-mono); font-size: 11px; color: var(--ink-4); }
.cell-strong { font-weight: 700; color: var(--ink); }
.cell-sub { font-size: 11.5px; color: var(--ink-4); margin-top: 2px; }
.cell-num { font-family: var(--font-mono); font-feature-settings: "tnum"; }

/* =============== Filter chips / tabs =============== */
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  padding: 5px 10px;
  border-radius: 999px;
  background: transparent;
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--ink-3);
  display: inline-flex; align-items: center; gap: 5px;
  white-space: nowrap;
}
.chip:hover { background: var(--surface-3); color: var(--ink); }
.chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }

.tabs {
  display: flex; gap: 4px;
  border-bottom: 1px solid var(--line);
  padding: 0 4px;
  margin-bottom: 0;
}
.tab {
  padding: 10px 12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-4);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab.active {
  color: var(--ink);
  border-bottom-color: var(--accent);
}
.tab .count {
  font-size: 10.5px;
  background: var(--surface-3);
  color: var(--ink-3);
  padding: 1px 6px;
  border-radius: 999px;
  font-feature-settings: "tnum";
}
.tab.active .count { background: var(--accent-soft); color: var(--accent); }

/* =============== Forms =============== */
.field { display: flex; flex-direction: column; gap: 4px; }
.field label {
  font-size: 11px; font-weight: 500; color: var(--ink-3);
  letter-spacing: 0.02em;
}
.field input, .field select, .field textarea {
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 7px;
  font-size: 13px;
  color: var(--ink);
  outline: none;
  width: 100%;
  transition: border-color 120ms, box-shadow 120ms;
}

// ============================================
// Atlas — utility helpers (no React)
// Exposes everything on window.U
// ============================================

window.U = (function () {
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  // Today is fixed for the prototype so all "due in X days" numbers stay stable
  const TODAY = new Date("2026-05-19T00:00:00Z");

  function fmtDate(s, format = "short") {
    if (!s) return "—";
    const d = typeof s === "string" ? new Date(s) : s;
    if (isNaN(d)) return "—";
    if (format === "short")   return `${d.getUTCDate()} ${months[d.getUTCMonth()]} ${String(d.getUTCFullYear()).slice(2)}`;
    if (format === "medium")  return `${d.getUTCDate()} ${months[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
    if (format === "long")    return d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
    if (format === "iso")     return d.toISOString().slice(0,10);
    if (format === "monthYr") return `${months[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
    if (format === "day")     return d.getUTCDate();
    return s;
  }
  function daysFromToday(s) {
    const d = new Date(s);
    return Math.round((d - TODAY) / 86400000);
  }
  function relTime(s) {
    const d = daysFromToday(s);
    if (d === 0) return "today";
    if (d === 1) return "tomorrow";
    if (d === -1) return "yesterday";
    if (d < 0)  return `${-d}d ago`;
    return `in ${d}d`;
  }
  function fmtMoney(v, unit = "K", decimals = 1) {
    if (v == null) return "—";
    if (Math.abs(v) >= 1000) return `${(v/1000).toFixed(decimals)}M ${unit === "K" ? "" : unit}`.trim();
    return `${v.toFixed(decimals)}${unit ? " " + unit : ""}`.trim();
  }
  function fmtCurrency(v, cur = "USD") {
    const sym = { USD: "$", EUR: "€", GBP: "£", DKK: "kr", QAR: "QR" }[cur] || cur;
    return `${sym}${Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 })}`;
  }
  function fmtPct(v, decimals = 0) { return `${v.toFixed(decimals)}%`; }
  function fmtHours(v) { return `${Number(v).toLocaleString("en-US", { maximumFractionDigits: 0 })} h`; }

  // status → badge class
  const statusBadge = {
    "Active":          "blue",
    "Running":         "blue",
    "Planning":        "violet",
    "Mobilising":      "amber",
    "Closeout":        "violet",
    "On Hold":         "amber",
    "Closed":          "green",
    "Completed":       "green",
    "Done":            "green",
    "Approved":        "green",
    "In Progress":     "blue",
    "Open":            "amber",
    "Pending":         "amber",
    "In Review":       "violet",
    "Submitted":       "violet",
    "Rejected":        "slate",
    "Overdue":         "red",
    "Delayed":         "red",
    "Cancelled":       "slate",
    "Draft":           "slate",
    "Issued":          "green",
    "Issued for Construction": "green",
    "Issued for Review":       "blue",
    "WIP":             "amber",
    "Mitigated":       "green",
    "Received":        "blue",
    "Sent":            "slate",
  };

  const priorityBadge = { High: "red", Medium: "amber", Low: "slate", Critical: "red" };

  function statusClass(s) { return statusBadge[s] || "neutral"; }
  function priorityClass(p) { return priorityBadge[p] || "neutral"; }

  // initials from a full name
  function initials(name) {
    if (!name) return "??";
    return name.split(" ").filter(Boolean).map(s => s[0]).slice(0,2).join("").toUpperCase();
  }

  // colour palette for chart series, ordered — Ramboll brand
  const chartPalette = [
    "#00ADB2", "#168494", "#00C4CA",   /* Ramboll Cyan family */
    "#3D8C6F", "#6BAA72",              /* Environmental greens */
    "#6B5FA8", "#4B5BA8",              /* Corporate purples */
    "#D97706", "#C2550F",              /* Functional amber/orange */
    "#C0392B", "#9B6B8A", "#5C5870",   /* Red, soft pink, slate */
  ];

  // discipline color — Ramboll brand-aligned
  const disciplineColors = {
    "PM":              "#19162C",   /* Corporate Dark */
    "Mechanical":      "#00ADB2",   /* Ramboll Cyan */
    "Electrical":      "#D97706",   /* Amber */
    "Instrumentation": "#6B5FA8",   /* Corporate violet */
    "Structural":      "#168494",   /* Ocean blue */
    "HSE":             "#3D8C6F",   /* Earth green */
    "Operations":      "#00C4CA",   /* Cyan light */
    "Procurement":     "#9B6B8A",   /* Soft pink */
    "Civil":           "#6BAA72",   /* Sage green */
    "Process":         "#C2550F",   /* Deep orange */
    "Commercial":      "#5C5870",   /* Charcoal slate */
    "Architecture":    "#C0392B",   /* Corporate red */
  };

  // ISO week of date (UTC)
  function isoWeek(d) {
    d = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
    d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
    const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
    return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  }

  function deterministicRand(seed) {
    // Mulberry32
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  return {
    TODAY, fmtDate, daysFromToday, relTime, fmtMoney, fmtCurrency, fmtPct, fmtHours,
    statusClass, priorityClass, statusBadge, priorityBadge,
    initials, chartPalette, disciplineColors,
    isoWeek, deterministicRand,
  };
})();

  <script type="text/babel">
// ============================================
// Atlas — Shared widgets
// KPI cards, sparkline, donut, bars, stacked bars, mini charts
// ============================================

const { useState, useEffect, useMemo, useRef } = React;

// ---------- Avatar -----------------------
function Avatar({ name, employee, size, color }) {
  const cls = "avatar" + (size ? " " + size : "");
  const emp = employee || (name && DB.employees.find(e => e.employee_id === name || e.full_name === name));
  const display = emp ? U.initials(emp.full_name) : (typeof name === "string" ? U.initials(name) : "??");
  const fullName = emp ? emp.full_name : name;
  const seed = (fullName || display).split("").reduce((a,c)=>a+c.charCodeAt(0), 0);
  const palette = ["#00ADB2","#168494","#00C4CA","#3D8C6F","#D97706","#C2550F","#C0392B","#9B6B8A","#6B5FA8","#4B5BA8","#5C5870"];
  const bg = color || palette[seed % palette.length];
  return <span className={cls} style={{ background: bg, color: "#fff" }} title={fullName}>{display}</span>;
}
function AvatarStack({ names, employees, size, max = 4 }) {
  const list = employees || (names || []);
  const visible = list.slice(0, max);
  const extra = list.length - max;
  return (
    <span className="avatar-stack">
      {visible.map((n, i) => {
        const isEmp = typeof n === "object";
        return isEmp
          ? <Avatar key={i} employee={n} size={size} />
          : <Avatar key={i} name={n} size={size} />;
      })}
      {extra > 0 && <span className={"avatar " + (size||"")} style={{ background: "var(--surface-3)", color: "var(--ink-3)" }}>+{extra}</span>}
    </span>
  );
}

// ---------- KPI ----------------------------
function KPI({ label, value, unit, icon, delta, deltaDir, foot, featured, color, sparkData }) {
  return (
    <div className={"kpi" + (featured ? " featured" : "")}>
      <div className="kpi-label">
        {icon && <Ico name={icon} size={12} />}
        {label}
      </div>
      <div className="kpi-value" style={color ? { color } : null}>
        {value}{unit && <span className="unit">{unit}</span>}
      </div>
      <div className="kpi-foot">
        {(delta || foot) && (
          <span className={"kpi-delta" + (deltaDir==="up"?" up":deltaDir==="down"?" down":"")}>
            {deltaDir === "up" && <Ico name="arrUp" size={11} />}
            {deltaDir === "down" && <Ico name="arrDown" size={11} />}
            {delta || foot}
          </span>
        )}
        {sparkData && <Sparkline data={sparkData} color={featured ? "rgba(255,255,255,0.7)" : (deltaDir==="down" ? "var(--red)" : "var(--accent)")} w={60} h={24} />}
      </div>
    </div>
  );
}

// ---------- Sparkline ----------------------
function Sparkline({ data, color, w = 120, h = 36, fill = true, stroke = 1.5 }) {
  if (!data || data.length === 0) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const step = w / (data.length - 1);
  const pts = data.map((d, i) => [i*step, h - ((d - min) / range) * (h - 4) - 2]);
  const path = pts.map((p,i) => (i===0?"M":"L") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = path + ` L ${w} ${h} L 0 ${h} Z`;
  const last = pts[pts.length-1];
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{display:"block"}}>
      {fill && <path d={area} fill={color} opacity={0.1}/>}
      <path d={path} fill="none" stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={last[0]} cy={last[1]} r={2.2} fill={color} />
    </svg>
  );
}

// ---------- Donut --------------------------
function Donut({ value, max = 100, size = 120, thickness = 12, color = "var(--accent)", track = "var(--surface-3)", children, gap = 0, segments }) {
  const r = (size - thickness) / 2;
  const c = 2 * Math.PI * r;
  if (segments) {
    let offset = 0;
    const total = segments.reduce((s,seg)=>s+seg.value, 0) || 1;
    return (
      <div style={{ position:"relative", width: size, height: size, display:"inline-block" }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track} strokeWidth={thickness}/>
          {segments.map((seg, i) => {
            const len = (seg.value / total) * c;
            const dash = `${Math.max(0, len-gap)} ${c}`;
            const dashoff = -offset;
            offset += len;
            return <circle key={i} cx={size/2} cy={size/2} r={r} fill="none"
              stroke={seg.color} strokeWidth={thickness}
              strokeDasharray={dash} strokeDashoffset={dashoff}
              transform={`rotate(-90 ${size/2} ${size/2})`}/>;
          })}
        </svg>
        {children != null && (
          <div style={{ position:"absolute", inset: 0, display:"grid", placeItems:"center", textAlign:"center", pointerEvents:"none" }}>{children}</div>
        )}
      </div>
    );
  }
  const pct = Math.max(0, Math.min(1, value/max));
  return (
    <div style={{ position:"relative", width: size, height: size, display:"inline-block" }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={track} strokeWidth={thickness}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={thickness}
          strokeDasharray={`${c*pct} ${c}`} strokeLinecap="round"
          transform={`rotate(-90 ${size/2} ${size/2})`}/>
      </svg>
      {children != null && (
        <div style={{ position:"absolute", inset: 0, display:"grid", placeItems:"center", textAlign:"center", pointerEvents:"none" }}>{children}</div>
      )}
    </div>
  );
}

// ---------- Bars ---------------------------
function Bars({ values, labels, colors, h = 90, w = 280, barW = 14, gap = 8, highlight }) {
  const max = Math.max(...values) || 1;
  const total = values.length * (barW + gap) - gap;
  const offset = (w - total) / 2;
  return (
    <svg width={w} height={h+18} viewBox={`0 0 ${w} ${h+18}`}>
      {values.map((v, i) => {
        const bh = (v / max) * h;
        const x = offset + i * (barW + gap);
        const y = h - bh;
        const col = colors ? colors[i] : "var(--accent)";
        const isHL = highlight != null && i === highlight;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={bh} rx={barW/2.4}
              fill={col} opacity={isHL ? 1 : 0.7}/>
            {labels && <text x={x + barW/2} y={h+13} textAnchor="middle" fontSize="9.5" fill="var(--ink-4)" fontFamily="var(--font-mono)">{labels[i]}</text>}
          </g>
        );
      })}
    </svg>
  );
}

// ---------- Stacked bar -------------------
function StackedBar({ segments, height = 8 }) {
  const total = segments.reduce((s,seg)=>s+seg.value, 0) || 1;
  return (
    <div style={{ display:"flex", width:"100%", height, borderRadius: height/2, overflow:"hidden", gap: 1, background: "var(--surface-3)" }}>
      {segments.map((seg, i) => (
        <div key={i} title={`${seg.label}: ${seg.value}`} style={{ width: `${(seg.value/total)*100}%`, background: seg.color }} />
      ))}
    </div>
  );
}

// ---------- Status pill ---------------------
function Status({ value }) {
  return <span className={"badge " + U.statusClass(value)}><span className="dot"/>{value}</span>;
}

// ---------- Progress with label -------------
function ProgressWithLabel({ value, color, height = 6 }) {
  return (
    <div className="row" style={{ gap: 10 }}>
      <div className="progress" style={{ flex: 1, height }}>
        <span style={{ width: value + "%", background: color || "var(--accent)" }}/>
      </div>
      <span className="mono tiny" style={{ minWidth: 32, textAlign: "right" }}>{value}%</span>
    </div>
  );
}

// ---------- Line chart (S-curve, simple) -----
function LineChart({ series, months, w = 480, h = 200, currentIdx, yMax }) {
  const pad = 28;
  const allVals = series.flatMap(s => s.data.filter(v => v != null));
  const max = yMax || Math.max(...allVals, 1);
  const xs = (i) => pad + (i/(months.length-1)) * (w - pad*2);
  const ys = (v) => h - pad - (v/max) * (h - pad*1.6);
  const path = (data) => data.map((v, i) => v==null ? null : (i===0 || data[i-1]==null?"M":"L") + xs(i).toFixed(1) + " " + ys(v).toFixed(1)).filter(Boolean).join(" ");

  const gridSteps = 5;
  return (
    <svg width="100%" viewBox={`0 0 ${w} ${h+12}`}>
      {Array.from({length:gridSteps+1}).map((_,i) => {
        const v = (max/gridSteps) * i;
        return (
          <g key={i}>
            <line x1={pad} y1={ys(v)} x2={w-pad} y2={ys(v)} stroke="var(--line)"/>
            <text x={pad-6} y={ys(v)+3} textAnchor="end" fontSize="9" fill="var(--ink-4)" fontFamily="var(--font-mono)">{Math.round(v)}</text>
          </g>
        );
      })}
      {series.map((s, idx) => (
        <g key={idx}>
          <path d={path(s.data)} stroke={s.color} strokeWidth={s.dashed ? 1.5 : 2} fill="none"
            strokeDasharray={s.dashed ? "4 3" : null} strokeLinecap="round" strokeLinejoin="round"/>
          {s.data.map((v, i) => v == null ? null : (
            <circle key={i} cx={xs(i)} cy={ys(v)} r={s.dotR || 2.5} fill={s.color}/>
          ))}
        </g>
      ))}
      {currentIdx != null && (
        <g>
          <line x1={xs(currentIdx)} y1={pad-4} x2={xs(currentIdx)} y2={h-pad} stroke="var(--accent)" strokeDasharray="2 2" opacity="0.6"/>
          <text x={xs(currentIdx)} y={pad-8} textAnchor="middle" fontSize="9" fill="var(--accent)" fontFamily="var(--font-mono)">NOW</text>
        </g>
      )}
      {months.map((m, i) => (
        i % Math.ceil(months.length/8) === 0 ? <text key={i} x={xs(i)} y={h-pad+12} textAnchor="middle" fontSize="9" fill="var(--ink-4)">{m}</text> : null
      ))}
    </svg>
  );
}

// ---------- Card heading helper -------------
function CardH({ title, subtitle, action, onAction }) {
  return (
    <div className="card-h">
      <div>
        <h3 className="card-title">{title}</h3>
        {subtitle && <div className="muted tiny" style={{marginTop: 2}}>{subtitle}</div>}
      </div>
      {action && (
        <button className="card-action" onClick={onAction}>
          {action} <Ico name="arrRight" size={11}/>
        </button>
      )}
    </div>
  );
}

// ---------- Page header ----------------------
function PageHeader({ eyebrow, title, subtitle, actions, crumb }) {
  return (
    <>
      {crumb && (
        <div className="crumb">
          {crumb.map((c, i) => (
            <React.Fragment key={i}>
              {i > 0 && <Ico name="chevRight" size={12}/>}
              {c.onClick
                ? <a onClick={c.onClick} style={{cursor:"pointer"}}>{c.label}</a>
                : <span style={{color: i === crumb.length-1 ? "var(--ink)" : null}}>{c.label}</span>
              }
            </React.Fragment>
          ))}
        </div>
      )}
      <div className="page-header">
        <div>
          {eyebrow && <div className="page-eyebrow">{eyebrow}</div>}
          <h1 className="page-title">{title}</h1>
          {subtitle && <p className="page-subtitle">{subtitle}</p>}
        </div>
        {actions && <div className="row" style={{gap: 6, flexWrap:"wrap", justifyContent:"flex-end"}}>{actions}</div>}
      </div>
    </>
  );
}

// ---------- Empty state ---------------------
function Empty({ icon = "box", title, subtitle, action }) {
  return (
    <div className="empty">
      <Ico name={icon} size={28} color="var(--ink-5)" />
      <h3>{title}</h3>
      <div style={{ maxWidth: 380, margin: "0 auto" }}>{subtitle}</div>
      {action && <div style={{ marginTop: 14 }}>{action}</div>}
    </div>
  );
}

Object.assign(window, {
  Avatar, AvatarStack, KPI, Sparkline, Donut, Bars, StackedBar,
  Status, ProgressWithLabel, LineChart, CardH, PageHeader, Empty,
});

  </script>

  <script type="text/babel">
// ============================================
// Atlas — Table & layout primitives
// DataTable, FilterBar, Drawer, Modal, Tabs, Field
// ============================================

// ---------- Data Table -------------------
function DataTable({ columns, rows, onRowClick, selectedKey, rowKey = "id", emptyMessage }) {
  if (!rows || rows.length === 0) {
    return <Empty title="No records" subtitle={emptyMessage || "No data matches your filters."}/>;
  }
  return (
    <table className="data">
      <thead>
        <tr>
          {columns.map((c, i) => (
            <th key={i} style={c.headerStyle} className={c.numeric ? "num" : ""}>
              {c.header}
            </th>
          ))}
        </tr>
      </thead>
      <tbody>
        {rows.map((r) => {
          const key = r[rowKey] || r.id || r.project_id || r.employee_id || r.deliverable_id;
          const selected = selectedKey === key;
          return (
            <tr key={key}
                className={selected ? "selected" : ""}
                onClick={onRowClick ? () => onRowClick(r) : undefined}
                style={onRowClick ? null : { cursor: "default" }}>
              {columns.map((c, i) => (
                <td key={i} style={c.cellStyle} className={c.numeric ? "num" : ""}>
                  {c.render ? c.render(r) : r[c.field]}
                </td>
              ))}
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

// ---------- TableWrap (card + header) ----
function TableWrap({ title, subtitle, count, actions, children }) {
  return (
    <div className="table-wrap">
      <div className="table-head">
        <div className="table-head-l">
          <div className="row" style={{gap:8}}>
            {title && <h3 className="card-title">{title}</h3>}
            {count != null && <span className="badge neutral">{count}</span>}
          </div>
          {subtitle && <div className="muted tiny">{subtitle}</div>}
        </div>
        {actions && <div className="table-head-r">{actions}</div>}
      </div>
      {children}
    </div>
  );
}

// ---------- FilterBar --------------------
function FilterBar({ chips, value, onChange, searchPlaceholder, search, onSearch, right }) {
  return (
    <div className="row" style={{ gap: 12, flexWrap: "wrap" }}>
      {onSearch && (
        <div className="topbar-search" style={{ maxWidth: 260, flex: 1, minWidth: 200, background: "var(--surface)", border: "1px solid var(--line)" }}>
          <Ico name="search" size={14} color="var(--ink-4)" />
          <input value={search || ""} onChange={e => onSearch(e.target.value)} placeholder={searchPlaceholder || "Search…"}/>
        </div>
      )}
      {chips && (
        <div className="chips">
          {chips.map(c => (
            <button key={c.value || c} className={"chip" + (value === (c.value || c) ? " active" : "")} onClick={() => onChange(c.value || c)}>
              {c.label || c}{c.count != null && <span className="muted tiny mono"> {c.count}</span>}
            </button>
          ))}
        </div>
      )}
      <div style={{ flex: 1 }}/>
      {right}
    </div>
  );
}

// ---------- Drawer -----------------------
function Drawer({ title, onClose, children, footer, width = 560 }) {
  React.useEffect(() => {
    const esc = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", esc);
    document.body.style.overflow = "hidden";
    return () => {
      window.removeEventListener("keydown", esc);
      document.body.style.overflow = "";
    };
  }, [onClose]);
  return (
    <div className="drawer-overlay" onClick={onClose}>
      <div className="drawer" style={{ width }} onClick={e => e.stopPropagation()}>
        <div style={{ position: "sticky", top: 0, background: "var(--surface)", zIndex: 2, padding: "16px 22px", borderBottom: "1px solid var(--line)", display:"flex", alignItems:"center", justifyContent:"space-between"}}>
          <div className="page-eyebrow" style={{margin: 0}}>{title}</div>
          <button className="icon-btn" onClick={onClose}><Ico name="x" size={14}/></button>
        </div>
        <div style={{ padding: 22 }}>{children}</div>
        {footer && (
          <div style={{ position: "sticky", bottom: 0, background: "var(--surface)", borderTop: "1px solid var(--line)", padding: "12px 22px", display:"flex", gap: 8, justifyContent:"flex-end" }}>
            {footer}
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Modal -----------------------
function Modal({ title, onClose, children, footer, width }) {
  React.useEffect(() => {
    const esc = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", esc);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", esc); document.body.style.overflow = ""; };
  }, [onClose]);
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={width ? { width } : null} onClick={e => e.stopPropagation()}>
        <div style={{padding:"18px 22px", borderBottom:"1px solid var(--line)", display:"flex", alignItems:"center", justifyContent:"space-between"}}>
          <h3 className="card-title" style={{fontSize:16}}>{title}</h3>
          <button className="icon-btn" onClick={onClose}><Ico name="x" size={14}/></button>
        </div>
        <div style={{padding: 22}}>{children}</div>
        {footer && (
          <div style={{padding: "12px 22px", borderTop:"1px solid var(--line)", display:"flex", gap: 8, justifyContent:"flex-end"}}>
            {footer}
          </div>
        )}
      </div>
    </div>
  );
}

// ---------- Tabs -------------------------
function Tabs({ tabs, active, onChange }) {
  return (
    <div className="tabs">
      {tabs.map(t => (
        <div key={t.value || t}
             className={"tab" + (active === (t.value || t) ? " active" : "")}

  );

// ---------- Pagination ----------------------
function Pagination({ page, totalPages, onPage }) {
  if (totalPages <= 1) return null;
  return (
    <div className="row" style={{ justifyContent:"space-between", padding: "12px 18px", borderTop: "1px solid var(--line)" }}>
      <span className="muted tiny">Page {page} of {totalPages}</span>
      <div className="row" style={{ gap: 4 }}>
        <button className="btn sm" disabled={page <= 1} onClick={() => onPage(page-1)}>

        </button>
        <button className="btn sm" disabled={page >= totalPages} onClick={() => onPage(page+1)}>
          Next <Ico name="chevRight" size={12}/>
        </button>
      </div>
    </div>
  );
}

// ----------------- Router -----------------
// Hash routing.  Supports patterns:
//   #/                       → dashboard
//   #/dashboard
//   #/projects               → list
//   #/projects/new           → create form
//   #/projects/P-001         → project detail (overview tab)
//   #/projects/P-001/tab     → project detail (specific tab)
//   #/deliverables/DEL-0006  → deliverable detail
//   ...
function parseHash(hash) {
  let h = hash.replace(/^#\/?/, "");
  if (!h) return { route: "dashboard", parts: [] };
  const parts = h.split("/");
  return { route: parts[0], parts: parts.slice(1), raw: h };
}
function useRoute() {
  const [hash, setHash] = React.useState(() => location.hash);
  React.useEffect(() => {
    const on = () => setHash(location.hash);
    window.addEventListener("hashchange", on);
    return () => window.removeEventListener("hashchange", on);
  }, []);
  return parseHash(hash);
}

// Helper for screen navigation
function navTo(path) {
  if (!path.startsWith("#")) path = "#/" + path.replace(/^\//, "");
  location.hash = path;
  window.scrollTo({ top: 0, behavior: "instant" });
}

                    <td>

              <div style={{
                width: 28, height: 28, borderRadius: 8,
                background: n.type === "approval"    ? "var(--blue-soft)" :
                            n.type === "deliverable" ? "var(--violet-soft)" :
                            n.type === "budget"      ? "var(--amber-soft)" :
                            n.type === "risk"        ? "var(--red-soft)" :
                                                        "var(--surface-3)",
                color:      n.type === "approval"    ? "var(--blue)" :
                            n.type === "deliverable" ? "var(--violet)" :
                            n.type === "budget"      ? "var(--amber)" :
                            n.type === "risk"        ? "var(--red)" :
                                                        "var(--ink-3)",
                display: "grid", placeItems: "center", flexShrink: 0,
              }}>
                <Ico name={
                  n.type === "approval"    ? "checkSquare" :
                  n.type === "deliverable" ? "layers" :
                  n.type === "budget"      ? "dollar" :
                  n.type === "risk"        ? "shield" :
                  n.type === "change"      ? "git" :
                  n.type === "mention"     ? "at" :
                                              "bell"
                } size={13}/>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 12.5, fontWeight: 500 }}>{n.title}</div>
                <div className="muted tiny" style={{ marginTop: 2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{n.message}</div>

      {/* Approvals waiting + Upcoming milestones */}
      <div className="grid" style={{ gridTemplateColumns: "1fr 1fr" }}>
        <div className="card">
          <CardH title="Approvals waiting on you" action="Open queue" onAction={() => navTo("approvals")}/>

            const approver = DB.employeeById(a.approver_id);
            return (
              <div key={a.approval_id} className="row" style={{ padding: "10px 0", borderBottom: "1px solid var(--line)", gap: 10 }}>
                <span className="badge outline" style={{ fontSize: 10 }}>{a.entity_type}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="row" style={{ gap: 8 }}>

                    <span style={{ fontSize: 12.5, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{a.title}</span>

                </div>
                <span className={"badge " + U.priorityClass(a.priority)} style={{ fontSize: 10 }}>{a.priority}</span>
                <Avatar employee={approver} size="sm"/>
              </div>

          })}
        </div>

        <div className="card">
          <CardH title="Upcoming milestones" subtitle="GFB-101 · Green Fuel Bridging Study" action="Project plan" onAction={() => navTo("projects/P-001/gantt")}/>
          {DB.milestones.filter(m => m.status !== "Completed").slice(0,5).map(m => {
            const d = U.daysFromToday(m.due_date);

              <div key={m.milestone_id} className="row" style={{ padding: "10px 0", borderBottom: "1px solid var(--line)", gap: 12 }}>

                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12.5 }}>{m.title}</div>

                </div>
                <Status value={m.status}/>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ScreenProjectsList() {
  const [search, setSearch] = React.useState("");
  const [status, setStatus] = React.useState("All");
  const [client, setClient] = React.useState("All");
  const [type, setType]     = React.useState("All");
  const [view, setView]     = React.useState("table"); // table | cards

  const clients = ["All", ...Array.from(new Set(DB.projects.map(p => p.client)))];
  const types   = ["All", ...Array.from(new Set(DB.projects.map(p => p.project_type)))];

  const filtered = DB.projects.filter(p => {
    if (status !== "All" && p.status !== status) return false;
    if (client !== "All" && p.client !== client) return false;
    if (type   !== "All" && p.project_type !== type) return false;
    if (search) {
      const q = search.toLowerCase();
      if (!(p.project_name + p.project_code + p.client).toLowerCase().includes(q)) return false;
    }
    return true;
  });

  const statusChips = ["All","Active","Planning","On Hold","Closeout"].map(s => ({
    value: s, label: s,
    count: s === "All" ? DB.projects.length : DB.projects.filter(p => p.status === s).length,
  }));

  return (
    <div className="content">
      <PageHeader
        eyebrow="Workspace"
        title="Projects"
        subtitle={`${filtered.length} of ${DB.projects.length} projects · filter by status, client, or type.`}
        actions={
          <>
            <button className="btn"><Ico name="download" size={13}/>Export</button>
            <a className="btn primary" href="#/projects/new"><Ico name="plus" size={13}/>New project</a>
          </>
        }
      />

      <FilterBar
        chips={statusChips}
        value={status}
        onChange={setStatus}
        search={search}
        onSearch={setSearch}
        searchPlaceholder="Search projects..."
        right={
          <>
            <select className="btn" style={{ paddingRight: 24 }} value={client} onChange={e => setClient(e.target.value)}>
              {clients.map(c => <option key={c} value={c}>{c === "All" ? "All clients" : c}</option>)}
            </select>
            <select className="btn" style={{ paddingRight: 24 }} value={type} onChange={e => setType(e.target.value)}>
              {types.map(t => <option key={t} value={t}>{t === "All" ? "All types" : t}</option>)}
            </select>
            <div className="row" style={{ gap: 2, marginLeft: 4, background: "var(--surface-3)", borderRadius: 7, padding: 2 }}>
              <button className={"icon-btn" + (view === "table" ? " active" : "")} onClick={() => setView("table")}
                      style={{ width: 28, height: 28, background: view === "table" ? "var(--surface)" : "transparent" }}>
                <Ico name="list" size={14}/>
              </button>
              <button className={"icon-btn" + (view === "cards" ? " active" : "")} onClick={() => setView("cards")}
                      style={{ width: 28, height: 28, background: view === "cards" ? "var(--surface)" : "transparent" }}>
                <Ico name="cards" size={14}/>
              </button>
            </div>
          </>
        }
      />

      {view === "table" ? (
        <div className="card flush">
          <table className="data">
            <thead>
              <tr>
                <th>Project</th><th>Client</th><th>Type</th><th>PM</th>
                <th>Progress</th><th className="num">Budget</th><th>Submission</th><th>Status</th><th>Health</th><th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(p => {
                const pm = DB.employeeById(p.pm_id);
                const c = DB.costs.find(c => c.project_id === p.project_id);
                return (
                  <tr key={p.project_id} onClick={() => navTo("projects/" + p.project_id)}>
                    <td>
                      <div className="cell-strong">{p.project_name}</div>
                      <div className="cell-sub mono">{p.project_code}</div>
                    </td>
                    <td>{p.client}<div className="cell-sub">{p.country}</div></td>
                    <td><span className="badge outline" style={{ fontSize: 10 }}>{p.project_type}</span></td>
                    <td><div className="row" style={{ gap: 8 }}><Avatar employee={pm} size="sm"/><span className="tiny">{pm.full_name.split(" ").pop()}</span></div></td>
                    <td style={{ width: 160 }}><ProgressWithLabel value={p.progress}/></td>
                    <td className="num cell-num">${(p.budget/1e6).toFixed(2)}M</td>
                    <td><span className="mono tiny">{U.fmtDate(p.submission_date)}</span></td>
                    <td><Status value={p.status}/></td>
                    <td>
                      <span style={{
                        display: "inline-block", width: 10, height: 10, borderRadius: "50%",
                        background: p.health === "green" ? "var(--green)" : p.health === "amber" ? "var(--amber)" : "var(--red)",
                      }} title={p.health}/>
                    </td>
                    <td><Ico name="chevRight" size={14} color="var(--ink-4)"/></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      ) : (
        <div className="grid" style={{ gridTemplateColumns: "repeat(3, 1fr)" }}>
          {filtered.map(p => {
            const pm = DB.employeeById(p.pm_id);
            const c = DB.costs.find(c => c.project_id === p.project_id);
            const disc = DB.disciplines.filter(d => d.project_id === p.project_id);
            return (
              <div key={p.project_id} className="card" onClick={() => navTo("projects/" + p.project_id)}
                   style={{ cursor: "pointer" }}>
                <div className="row" style={{ justifyContent: "space-between", marginBottom: 10 }}>
                  <span className="cell-id">{p.project_code}</span>
                  <span style={{
                    display: "inline-block", width: 10, height: 10, borderRadius: "50%",
                    background: p.health === "green" ? "var(--green)" : p.health === "amber" ? "var(--amber)" : "var(--red)",
                  }}/>
                </div>
                <div style={{ fontSize: 15, fontWeight: 500, letterSpacing: "-0.015em", marginBottom: 4 }}>{p.project_name}</div>
                <div className="muted tiny" style={{ marginBottom: 12 }}>{p.client} · {p.country}</div>
                <ProgressWithLabel value={p.progress}/>
                <div className="row" style={{ justifyContent:"space-between", marginTop: 12, fontSize: 11, color:"var(--ink-3)" }}>
                  <span>${(p.budget/1e6).toFixed(1)}M budget</span>
                  <span>{disc.length || 4} disciplines</span>
                </div>
                <div className="divider" style={{margin:"12px 0"}}/>
                <div className="row" style={{ justifyContent:"space-between" }}>
                  <Status value={p.status}/>
                  <div className="row" style={{ gap: 6 }}>
                    <Avatar employee={pm} size="sm"/>
                    <span className="tiny muted">{pm.full_name.split(" ").pop()}</span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ScreenProjectCreate() {
  const [form, setForm] = React.useState({
    name: "", code: "", client: "", country: "Qatar", type: "FEED Study",
    start: "", end: "", submission: "", priority: "Medium", pm: "EMP-001",
    budget: "", feeFactor: "2.75", contingency: "8", tenderFee: "",
    description: "", tags: "",
  });
  function up(k, v) { setForm(f => ({ ...f, [k]: v })); }

  return (
    <div className="content" style={{ maxWidth: 980 }}>
      <PageHeader
        crumb={[{ label: "Projects", onClick: () => navTo("projects") }, { label: "New project" }]}
        title="Create project"
        subtitle="The project metadata you enter here becomes the spine — every discipline, deliverable, cost line and resource allocation that follows ties back to this record."
        actions={
          <>
            <a className="btn" href="#/projects">Cancel</a>
            <button className="btn">Save as draft</button>
            <button className="btn primary"><Ico name="plus" size={13}/>Create project</button>
          </>
        }
      />

      <div className="grid" style={{ gridTemplateColumns: "1fr 320px" }}>
        <div className="col" style={{ gap: 16 }}>
          {/* Section 1: Project information */}
          <div className="card">
            <CardH title="Project information"/>
            <div className="grid" style={{ gridTemplateColumns: "1fr 1fr", gap: 14 }}>
              <div className="field" style={{ gridColumn: "1 / -1" }}>
                <label>Project name *</label>
                <input value={form.name} onChange={e => up("name", e.target.value)} placeholder="e.g. Green Fuel Bridging Study"/>
              </div>
              <div className="field"><label>Project code *</label><input value={form.code} onChange={e => up("code", e.target.value)} placeholder="GFB-101"/></div>
              <div className="field"><label>Client *</label><input value={form.client} onChange={e => up("client", e.target.value)} placeholder="QatarEnergy LNG"/></div>
              <div className="field">
                <label>Country</label>
                <select value={form.country} onChange={e => up("country", e.target.value)}>
                  {["Qatar","UAE","Saudi Arabia","Oman","Kuwait","Denmark","UK"].map(c => <option key={c}>{c}</option>)}
                </select>
              </div>
              <div className="field">
                <label>Project type</label>
                <select value={form.type} onChange={e => up("type", e.target.value)}>
                  {["FEED Study","Pre-FEED","Detailed Design","Concept Design","EPC Support","Bridging Study"].map(t => <option key={t}>{t}</option>)}
                </select>
              </div>
              <div className="field" style={{ gridColumn: "1 / -1" }}>
                <label>Description</label>
                <textarea rows={3} value={form.description} onChange={e => up("description", e.target.value)} placeholder="Brief scope and objectives..."/>
              </div>
              <div className="field" style={{ gridColumn: "1 / -1" }}>
                <label>Tags</label>
                <input value={form.tags} onChange={e => up("tags", e.target.value)} placeholder="Hydrogen, FEED, Bridging"/>
                <div className="hint">Comma-separated. Used for portfolio filtering.</div>
              </div>
            </div>
          </div>

          {/* Section 2: Schedule */}
          <div className="card">
            <CardH title="Schedule"/>
            <div className="grid" style={{ gridTemplateColumns: "1fr 1fr 1fr", gap: 14 }}>
              <div className="field"><label>Start date *</label><input type="date" value={form.start} onChange={e => up("start", e.target.value)}/></div>
              <div className="field"><label>End date *</label><input type="date" value={form.end} onChange={e => up("end", e.target.value)}/></div>
              <div className="field"><label>Submission date</label><input type="date" value={form.submission} onChange={e => up("submission", e.target.value)}/></div>
              <div className="field">
                <label>Priority</label>
                <select value={form.priority} onChange={e => up("priority", e.target.value)}>
                  {["High","Medium","Low"].map(p => <option key={p}>{p}</option>)}
                </select>
              </div>
              <div className="field" style={{ gridColumn: "span 2" }}>
                <label>Project manager *</label>
                <select value={form.pm} onChange={e => up("pm", e.target.value)}>
                  {DB.employees.filter(e => e.discipline === "PM").map(e => <option key={e.employee_id} value={e.employee_id}>{e.full_name} — {e.job_title}</option>)}
                </select>
              </div>
            </div>
          </div>

          {/* Section 3: Financials */}
          <div className="card">
            <CardH title="Financials" subtitle="Drives the cost engine and forecasts"/>
            <div className="grid" style={{ gridTemplateColumns: "1fr 1fr", gap: 14 }}>
              <div className="field"><label>Budget (USD)</label><input type="number" value={form.budget} onChange={e => up("budget", e.target.value)} placeholder="4,850,000"/></div>
              <div className="field"><label>Tender fee (USD)</label><input type="number" value={form.tenderFee} onChange={e => up("tenderFee", e.target.value)} placeholder="285,000"/></div>
              <div className="field"><label>Fee factor</label><input type="number" step="0.01" value={form.feeFactor} onChange={e => up("feeFactor", e.target.value)}/><div className="hint">Multiplier applied to hourly cost when invoicing.</div></div>
              <div className="field"><label>Contingency (%)</label><input type="number" value={form.contingency} onChange={e => up("contingency", e.target.value)}/></div>
            </div>

            <hr className="divider" style={{ margin: "16px 0" }}/>

            <h4 className="muted xs" style={{ letterSpacing: "0.12em", textTransform: "uppercase", marginBottom: 12 }}>Derived figures</h4>
            <div className="grid" style={{ gridTemplateColumns: "repeat(4, 1fr)" }}>
              <StatBox label="Contingency $" value={form.budget && form.contingency ? `$${(form.budget * form.contingency / 100 / 1000).toFixed(0)}K` : "—"}/>
              <StatBox label="Net of contingency" value={form.budget ? `$${((form.budget * (1 - (form.contingency||0)/100)) / 1e6).toFixed(2)}M` : "—"}/>
              <StatBox label="Effective fee" value={form.feeFactor ? `${form.feeFactor}×` : "—"}/>
              <StatBox label="Required hours" value={form.budget && form.feeFactor ? `${Math.round(form.budget / (90 * form.feeFactor)).toLocaleString()} h` : "—"} sub="@ blended $90/hr"/>
            </div>
          </div>

          {/* Section 4: Templates */}
          <div className="card">
            <CardH title="Start from template" subtitle="Pre-populate disciplines, deliverables, and milestone schedule"/>
            <div className="grid" style={{ gridTemplateColumns: "repeat(3, 1fr)", gap: 10 }}>
              {[
                { name: "Blank project",   sub: "Start from scratch",    icon: "plus",  active: true },
                { name: "FEED template",   sub: "10 disciplines · 65 deliverables", icon: "fileText" },
                { name: "Bridging template", sub: "7 disciplines · 32 deliverables", icon: "git" },
                { name: "Detailed design", sub: "12 disciplines · 110 deliverables", icon: "layers" },
                { name: "EPC support",     sub: "8 disciplines · 48 deliverables",  icon: "tools" },
                { name: "Concept design",  sub: "6 disciplines · 22 deliverables",  icon: "edit" },
              ].map(t => (
                <div key={t.name} className="card" style={{ padding: 12, cursor: "pointer", borderColor: t.active ? "var(--accent)" : "var(--line)", background: t.active ? "var(--accent-soft-2)" : "var(--surface)" }}>
                  <div className="row" style={{ gap: 10, marginBottom: 4 }}>
                    <div style={{ width: 26, height: 26, background: t.active ? "var(--accent)" : "var(--surface-3)", color: t.active ? "#fff" : "var(--ink-3)", borderRadius: 6, display: "grid", placeItems: "center" }}>
                      <Ico name={t.icon} size={13}/>
                    </div>
                    <span style={{ fontWeight: 500, fontSize: 13 }}>{t.name}</span>
                  </div>
                  <div className="muted tiny">{t.sub}</div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {/* Right rail: project preview / checklist */}
        <div className="col" style={{ gap: 16 }}>
          <div className="card">
            <CardH title="Setup checklist"/>
            {[
              { l: "Project information", done: form.name && form.code && form.client },
              { l: "Schedule",            done: form.start && form.end },
              { l: "Financials",          done: form.budget && form.feeFactor },
              { l: "Project manager",     done: !!form.pm },
              { l: "Disciplines",         done: false, sub: "Add after creation" },
              { l: "Team assignments",    done: false, sub: "Add after creation" },
              { l: "Deliverables list",   done: false, sub: "Add after creation" },
            ].map((s, i) => (
              <div key={s.l} className="row" style={{ padding: "8px 0", borderBottom: i < 6 ? "1px solid var(--line)" : null, gap: 10 }}>
                <Ico name={s.done ? "checkCircle" : "circle"} size={16} color={s.done ? "var(--green)" : "var(--ink-5)"}/>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 12.5, fontWeight: s.done ? 500 : 400, color: s.done ? "var(--ink)" : "var(--ink-3)" }}>{s.l}</div>
                  {s.sub && <div className="muted tiny">{s.sub}</div>}
                </div>
              </div>
            ))}
          </div>

          <div className="card muted">

// OVERVIEW TAB

function ProjectOverview({ p, cost, disc, dels, risksList, milestones }) {
  const lateDels = dels.filter(d => d.status === "Delayed" || (d.status === "In Progress" && U.daysFromToday(d.planned_date) < 0));
  const upcoming = milestones.filter(m => m.status !== "Completed").sort((a,b)=> a.due_date.localeCompare(b.due_date)).slice(0,4);
  const consumedHours = disc.reduce((s,d)=>s+d.actual_hours, 0);
  const plannedHours  = disc.reduce((s,d)=>s+d.planned_hours, 0);

  return (
    <div className="col" style={{ gap: 14 }}>
      {/* Widget strip */}
      <div className="kpi-grid">
        <KPI featured label="Project progress" icon="trendUp" value={p.progress + "%"} foot={`${p.health[0].toUpperCase() + p.health.slice(1)} status`}/>
        <KPI label="Hours consumed" icon="clock" value={Math.round(consumedHours/1000) + "K"} unit={"/" + Math.round(plannedHours/1000) + "K"} foot={`${Math.round(consumedHours/plannedHours*100)}% of plan`}/>
        <KPI label="Remaining budget" icon="dollar" value={"$" + ((p.budget-cost.spent)/1e6).toFixed(2) + "M"} foot={Math.round((1-cost.spent/p.budget)*100) + "% left"}/>
        <KPI label="Late deliverables" icon="alertTri" value={lateDels.length} delta={lateDels.length > 0 ? "needs attention" : "on track"} deltaDir={lateDels.length > 0 ? "down" : "up"}/>
        <KPI label="Open risks" icon="shield" value={risksList.filter(r => r.status === "Open").length} foot="View register"/>
      </div>

      <div className="grid" style={{ gridTemplateColumns: "1.5fr 1fr" }}>
        {/* Discipline progress */}
        <div className="card">
          <CardH title="Discipline progress" subtitle="Hours consumed vs plan"/>
          <div className="col" style={{ gap: 10 }}>
            {disc.map(d => {
              const lead = DB.employeeById(d.lead_employee_id);
              const color = U.disciplineColors[d.name] || "var(--accent)";
              return (
                <div key={d.discipline_id} className="row" style={{ gap: 12 }}>
                  <div className="row" style={{ gap: 8, width: 200 }}>
                    <span style={{ width: 8, height: 8, borderRadius: 2, background: color }}/>
                    <span style={{ fontSize: 12.5 }}>{d.name}</span>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div className="progress" style={{ height: 8 }}>
                      <span style={{ width: d.completion_percent + "%", background: color }}/>
                    </div>
                  </div>
                  <span className="mono tiny" style={{ width: 90, textAlign: "right" }}>{d.actual_hours.toLocaleString()} / {d.planned_hours.toLocaleString()}h</span>
                  <span className="mono tiny" style={{ width: 36, textAlign: "right", fontWeight: 500 }}>{d.completion_percent}%</span>
                  <Avatar employee={lead} size="sm"/>
                </div>
              );
            })}
          </div>
        </div>

        {/* Upcoming milestones */}
        <div className="card">
          <CardH title="Upcoming milestones" action="See schedule" onAction={() => navTo(`projects/${p.project_id}/gantt`)}/>
          {upcoming.map(m => {
            const d = U.daysFromToday(m.due_date);
            return (
              <div key={m.milestone_id} className="row" style={{ padding: "10px 0", borderBottom: "1px solid var(--line)", gap: 10 }}>
                <Ico name="diamond" size={14} color={d < 14 ? "var(--accent)" : "var(--ink-4)"}/>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12.5 }}>{m.title}</div>
                  <div className="muted tiny mono">{m.milestone_id} · {U.fmtDate(m.due_date)}</div>
                </div>
                <span className="mono tiny" style={{ color: d < 7 ? "var(--red)" : d < 14 ? "var(--amber)" : "var(--ink-3)" }}>{d}d</span>
              </div>
            );
          })}
        </div>
      </div>

      <div className="grid" style={{ gridTemplateColumns: "1fr 1fr" }}>
        {/* Recent deliverables */}
        <div className="card">
          <CardH title="Recent deliverables" action="See all" onAction={() => navTo(`projects/${p.project_id}/deliverables`)}/>
          {dels.slice(0,5).map(d => (
            <div key={d.deliverable_id} className="row" style={{ padding: "10px 0", borderBottom: "1px solid var(--line)", gap: 10 }}>
              <Ico name="fileText" size={14} color="var(--ink-3)"/>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div className="row" style={{gap: 8}}>
                  <span className="mono tiny muted">{d.deliverable_code}</span>
                  <span className="badge outline" style={{fontSize:9.5}}>Rev {d.revision}</span>

                <div style={{ fontSize: 12.5, marginTop: 2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{d.title}</div>
              </div>
              <Status value={d.status}/>
            </div>
          ))}
        </div>

        {/* Risks summary */}
        <div className="card">
          <CardH title="Top risks" action="Open register" onAction={() => navTo(`projects/${p.project_id}/risks`)}/>
          {[...risksList].sort((a,b)=> (b.probability*b.impact) - (a.probability*a.impact)).slice(0,4).map(r => {
            const score = r.probability * r.impact;
            return (
              <div key={r.risk_id} className="row" style={{ padding: "10px 0", borderBottom: "1px solid var(--line)", gap: 10 }}>
                <span style={{
                  display:"inline-flex", width: 30, height: 24, alignItems:"center", justifyContent:"center",
                  background: score>=15?"var(--red-soft)":score>=10?"var(--orange-soft)":score>=5?"var(--amber-soft)":"var(--surface-3)",
                  color: score>=15?"var(--red)":score>=10?"var(--orange)":score>=5?"var(--amber)":"var(--ink-3)",

                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 12.5, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{r.title}</div>
                  <div className="muted tiny mono">{r.risk_id} · {r.category}</div>
                </div>
                <Avatar name={r.owner} size="sm"/>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

    <div className="col" style={{gap:14}}>

                onClick={() => setActive(d.name)}

            <KPI label="Actual hours" icon="activity" value={cur.actual_hours.toLocaleString()} delta={`${cur.completion_percent}% of plan`} deltaDir={cur.completion_percent > 100 ? "down":"up"}/>
            <KPI label="Discipline budget" icon="dollar" value={"$" + (cur.budget/1000).toFixed(0) + "K"}/>

            <table className="data">
              <thead><tr><th>Code</th><th>Title</th><th>Owner</th><th>Status</th><th>Progress</th><th>Due</th></tr></thead>
              <tbody>
                {dels.map(d => {
                  const owner = DB.employeeById(d.owner_employee_id);
                  return (
                    <tr key={d.deliverable_id} onClick={() => navTo("deliverables/"+d.deliverable_id)}>

                      <td>
                        <div className="row" style={{ gap: 8 }}>

// DELIVERABLES TAB (mini view; full page also exists)

function ProjectDeliverables({ p, dels }) {
  const [status, setStatus] = React.useState("All");
  const [disc,   setDisc]   = React.useState("All");
  const disciplines = ["All", ...Array.from(new Set(dels.map(d => d.discipline)))];
  const statuses = ["All","Draft","In Progress","In Review","Approved","Delayed","Issued"];

  const filtered = dels.filter(d => {
    if (status !== "All" && d.status !== status) return false;
    if (disc   !== "All" && d.discipline !== disc) return false;
    return true;
  });

  return (
    <div className="col" style={{gap: 14}}>
      <FilterBar
        chips={statuses.map(s => ({ value: s, label: s, count: s === "All" ? dels.length : dels.filter(d => d.status === s).length }))}
        value={status} onChange={setStatus}
        right={
          <select className="btn" value={disc} onChange={e => setDisc(e.target.value)}>
            {disciplines.map(d => <option key={d} value={d}>{d === "All" ? "All disciplines" : d}</option>)}
          </select>
        }
      />
      <div className="card flush">
        <table className="data">
          <thead><tr><th>Code</th><th>Title</th><th>Discipline</th><th>Owner</th><th>Status</th><th>Progress</th><th>Planned</th><th>Actual</th></tr></thead>
          <tbody>
            {filtered.map(d => {

function RisksView({ risks }) {
  const colorFor = (L, I) => {
    const s = L*I;
    if (s >= 15) return "var(--red)";
    if (s >= 10) return "var(--orange)";
    if (s >= 5)  return "var(--amber)";
    return "var(--green-soft)";
  };
  return (
    <div className="grid" style={{ gridTemplateColumns: "320px 1fr" }}>
      <div className="card">
        <CardH title="Heat map" subtitle="Probability × Impact"/>
        <div style={{display:"grid", gridTemplateColumns:"24px repeat(5, 1fr)", gridTemplateRows:"repeat(5, 1fr) 18px", gap: 4}}>
          {[5,4,3,2,1].map(I => (
            <React.Fragment key={I}>
              <div style={{display:"grid", placeItems:"center", fontSize: 10, color: "var(--ink-4)", fontFamily:"var(--font-mono)"}}>{I}</div>
              {[1,2,3,4,5].map(L => {
                const cellRisks = risks.filter(r => r.probability === L && r.impact === I && r.status === "Open");
                return (
                  <div key={L} className="heat-cell" style={{
                    background: colorFor(L,I), opacity: L*I >= 10 ? 0.95 : L*I >= 5 ? 0.85 : 0.45,
                    color: L*I >= 10 ? "#fff" : "var(--ink-2)",
                  }}>
                    <span style={{ fontSize: 9.5, opacity: 0.7 }}>{L*I}</span>
                    {cellRisks.length > 0 && (
                      <div className="row" style={{ gap: 3, flexWrap: "wrap" }}>
                        {cellRisks.slice(0,3).map(r => <span key={r.risk_id} style={{ fontSize: 9, background: "rgba(255,255,255,0.3)", padding: "1px 4px", borderRadius: 3 }}>{r.risk_id.replace("R-","")}</span>)}
                        {cellRisks.length > 3 && <span style={{ fontSize: 9 }}>+{cellRisks.length-3}</span>}
                      </div>
                    )}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
          <div/>
          {[1,2,3,4,5].map(n => <div key={n} style={{textAlign:"center", fontSize: 10, color: "var(--ink-4)", fontFamily:"var(--font-mono)"}}>{n}</div>)}
        </div>
        <div className="row" style={{ justifyContent: "space-between", marginTop: 6, fontSize: 10, color: "var(--ink-4)", letterSpacing: "0.1em", textTransform: "uppercase" }}>
          <span>Impact ↑</span>
          <span>Probability →</span>
        </div>
      </div>

      <div className="card flush">
        <div className="table-head">
          <div className="table-head-l">
            <h3 className="card-title">Risk register</h3>
            <div className="muted tiny">{risks.filter(r=>r.status==="Open").length} open · {risks.length} total</div>
          </div>
          <button className="btn primary sm"><Ico name="plus" size={12}/>New risk</button>
        </div>
        <table className="data">
          <thead><tr><th>ID</th><th>Risk</th><th>Category</th><th>Owner</th><th className="num">P</th><th className="num">I</th><th className="num">Score</th><th>Trend</th><th>Status</th></tr></thead>
          <tbody>
            {risks.map(r => {
              const owner = DB.employeeById(r.owner);
              return (
                <tr key={r.risk_id}>
                  <td className="cell-id">{r.risk_id}</td>
                  <td>
                    <div className="cell-strong">{r.title}</div>
                    <div className="cell-sub">{r.mitigation}</div>
                  </td>
                  <td><span className="badge outline" style={{ fontSize: 10 }}>{r.category}</span></td>
                  <td><Avatar employee={owner} size="sm"/></td>
                  <td className="num cell-num">{r.probability}</td>
                  <td className="num cell-num">{r.impact}</td>
                  <td className="num">
                    <span style={{
                      display:"inline-flex", width: 28, height: 22, alignItems:"center", justifyContent:"center",
                      background: r.probability*r.impact>=15?"var(--red-soft)":r.probability*r.impact>=10?"var(--orange-soft)":r.probability*r.impact>=5?"var(--amber-soft)":"var(--surface-3)",
                      color: r.probability*r.impact>=15?"var(--red)":r.probability*r.impact>=10?"var(--orange)":r.probability*r.impact>=5?"var(--amber)":"var(--ink-3)",
                      borderRadius: 5, fontWeight: 600,
                    }}>{r.probability*r.impact}</span>

                    <span className="tiny" style={{color: r.trend==="rising"?"var(--red)":r.trend==="falling"?"var(--green)":"var(--ink-4)"}}>
